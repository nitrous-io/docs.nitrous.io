---
layout: custom_page
---
<ul class="toc entries">
  {% assign posts = site.categories[page.category] %}
  {% for post in posts %}
    <li>
      <p>
        <a href="{{site.baseurl}}{{post.url}}">
          {{ post.title | replace: 'Faq', 'FAQ' | replace: 'Ssh', 'SSH' | replace: '-', ' '}}
        </a>
      </p>
    </li>
  {% endfor %}
</ul>
