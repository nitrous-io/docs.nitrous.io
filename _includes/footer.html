  <footer>
    <script src='{{site.baseurl}}/javascripts/jquery/jquery-2.1.1.min.js'></script>
    <script type='text/javascript' src='{{site.baseurl}}/javascripts/smoothscroll.js'></script>
    <script src='{{site.baseurl}}/css/bootstrap3/js/bootstrap.js'></script>
    <script src='{{site.baseurl}}/javascripts/highlight.js/highlight.pack.js'></script>
    <script src='{{site.baseurl}}/javascripts/search.min.js' type='text/javascript' charset='utf-8'></script>
    <script src='{{site.baseurl}}/javascripts/share.js' type='text/javascript' charset='utf-8'></script>
    <script type="text/javascript">
      $(function() {
        $('#search-query').lunrSearch({
          indexUrl: '/search.json',             // URL of the `search.json` index data for your site
          results:  '#search-results',          // jQuery selector for the search results container
          entries:  '.entries',                 // jQuery selector for the element to contain the results list, must be a child of the results element above.
          template: '#search-results-template'  // jQuery selector for the Mustache.js template
        });
      });
    </script>
    <script>hljs.initHighlightingOnLoad();</script>
    <script>
      (function(document) {
        var toggle = document.querySelector('.sidebar-toggle');
        var sidebar = document.querySelector('#sidebar');
        var checkbox = document.querySelector('#sidebar-checkbox');

        document.addEventListener('click', function(e) {
          var target = e.target;

          if(!checkbox.checked ||
             sidebar.contains(target) ||
             (target === checkbox || target === toggle)) return;

          checkbox.checked = false;
        }, false);
      })(document);
    </script>
