<section id="search-results">
  <h1>Search Results</h1>
  <ul class='entries'></ul>
  {% raw %}
  <script id="search-results-template" type="text/mustache">
    {{#entries}}
      <div class="post">
      <h3 class='post-title'><a href="{{site.baseurl}}{{post.url}}">{{title}}</a></h3>
      <p class="small text-muted">
        Published on {{#date}}<time datetime="{{pubdate}}" pubdate>{{displaydate}}</time>{{/date}}</time>
      </p>
    </div>
    <hr />
    {{/entries}}
  </script>
  {% endraw %}
</section>
