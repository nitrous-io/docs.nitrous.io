name: Nitrous.IO Documentation
highlighter: pygments
permalink: /:title
#category_links: change the category directory
baseurl: "/docs.nitrous.io"
category_title_prefix: ''
exclude: ['Gemfile', 'Gemfile.lock', 'Rakefile', 'README.md', 'vendor', 'node_modules', 'gulpfile.js']
sass:
    syntax: scss        # scss|sass
    style:  compressed  # nested|expanded|compact|compressed
lunr_search:
  excludes: [index.md, search/index.md, rss.xml, atom.xml, sitemap.xml]